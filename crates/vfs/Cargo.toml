[package]
name = "vfs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "WASM-SPIKE: std::fs on native; sync-XHR-backed game tree plus in-memory overlay on wasm."

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["XmlHttpRequest", "XmlHttpRequestResponseType"] }
serde_json = "1"
web-time = "1"
