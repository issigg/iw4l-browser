[package]
name = "web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "WASM-SPIKE: browser entry point."

[lib]
crate-type = ["cdylib"]

[dependencies]
bootstrap = { path = "../bootstrap" }
asset_transport.workspace = true
diag.workspace = true
sim.workspace = true
bevy = { workspace = true, features = ["webgpu"] }
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "0.1"
web_window.workspace = true
web-sys = { version = "0.3", features = ["OffscreenCanvas"] }
