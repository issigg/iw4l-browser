[package]
name = "net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Our wire: frames, deltas, prediction, interpolation. Not retail's netcode."

[dependencies]
web-time = "1"
vfs.workspace = true
structured_data_iw4.workspace = true
diag.workspace = true
math_iw4.workspace = true
frame.workspace = true
playerstate_iw4.workspace = true
entity_iw4.workspace = true
anim_iw4.workspace = true
xmodel_runtime.workspace = true
movement_iw4.workspace = true
input_iw4.workspace = true
weapon_iw4.workspace = true
gamemode_iw4.workspace = true
killcam_iw4.workspace = true
sim.workspace = true
hud_iw4.workspace = true
perf.workspace = true
bevy.workspace = true
master_protocol.workspace = true

# WASM-SPIKE: portable subset
tokio = { version = "1.47", features = ["macros", "sync", "time", "rt"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }

# WASM-SPIKE: heavy I/O deps native-only
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ring = "0.17.14"
updater = { path = "../updater" }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.47", features = ["net", "rt-multi-thread"] }
zstd = { version = "0.13", default-features = false }


# WASM-SPIKE
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
sha2 = "0.10"
ed25519-dalek = "2"

[lints]
workspace = true
